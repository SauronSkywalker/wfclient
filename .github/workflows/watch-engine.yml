name: watch-engine

# Workflow 4/4 -- 上游漂移守望者：上游一改"计算方式"，服务器就换 engine id。
# 用上游仓库的 push 事件是没用的：那是别人的仓库，我们收不到 webhook；
# 而且上游每次 push 大多是站点页面/文案，engine id 才是与计算强相关的信号。
# 所以这里定时问服务器"你现在服务的是哪个 engine"，只要本仓库还没有 engine-<id> 这条
# release，就 dispatch 一次 build-engine。
#
# 为什么盯 engine id 就够了：引擎和二乘计算器（紫卡优化器）编译在同一个二进制里，
# 服务器下发的 engine id 本身就是上游对"整套计算代码"算出来的标签，上游动了优化器
# 也会让 id 变。自己去扫源码只会更慢更不准，而且扫描量远大于两次 HTTP 请求。
on:
  schedule:
    # 每 5 分钟。5 分钟是 GitHub cron 的下限；高峰时段官方会推迟（常见 5-20 分钟），
    # 所以这是"尽快"，不是"准时"。构建本身不依赖这一点：客户端自己也会看伺服端 id。
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write        # 需要 dispatch build-engine

# 守望者自己串行跑就够了（单次约 20 秒，即便某次被推迟也不会堆积）
concurrency:
  group: watch-engine
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: is the engine the server serves already published?
        id: drift
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          import json, os, time, urllib.error, urllib.request, pathlib

          # 边缘会偶发 403（实测过一次：Cloudflare 直接 Forbidden），所以退避重试。
          # 站点是第三方，它一时不应答不该让守望者红叉报假警 —— 重试后仍失败就跳过本轮，
          # 5 分钟后下一轮自然会再试。
          RETRY = (403, 408, 425, 429, 500, 502, 503, 504)

          def fetch(url, headers=None, tries=5, timeout=30):
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers=headers or {})
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.status, r.read()
                  except urllib.error.HTTPError as e:
                      if e.code in RETRY and i < tries - 1:
                          wait = 3 * (i + 1)
                          print(f"  HTTP {e.code} from {url} -- 退避 {wait}s 后重试")
                          time.sleep(wait)
                          continue
                      raise

          # 一：服务器现在服务哪个 engine（1 个 GET，约 0.2 秒）
          try:
              _st, raw = fetch("https://wfsim.app/release.json",
                               headers={"User-Agent": "wfsimpp-client/0.1"})
          except Exception as e:
              print(f"!! 站点没答上来（{type(e).__name__}: {e}）；跳过本轮，5 分钟后再试")
              with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
                  f.write("needed=false\nengine=\n")
              raise SystemExit(0)
          rel = json.loads(raw)
          engine = str(rel.get("engine") or "")
          print(f"server serves: engine={engine} release={rel.get('release')} commit={rel.get('commit')}")

          # 二：本仓库有没有这条 release（1 个 GET；404 就是没有，不用列表整个 per_page=100）
          have = False
          if engine:
              try:
                  fetch(f"https://api.github.com/repos/{os.environ['REPO']}/releases/tags/engine-{engine}",
                        headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                                 "Accept": "application/vnd.github+json"})
                  have = True
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
          print("already published:", have)
          print("needed:", not have)
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
              f.write(f"needed={'false' if have else 'true'}\n")
              f.write(f"engine={engine}\n")

      - name: there is no engine-<id> release for it yet -- go build
        if: steps.drift.outputs.needed == 'true' && steps.drift.outputs.engine != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "engine ${{ steps.drift.outputs.engine }} is not published yet -> dispatching build-engine"
          gh workflow run build-engine.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
