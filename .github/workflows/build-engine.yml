name: build-engine

# Workflow 1 of 2 -- "补丁变了 -> 自动产出最新引擎"
# It syncs the *latest* upstream sources, applies ci/patches/*.patch and builds the engine the
# fast way (MSVC + PGO + mimalloc).  Nothing is published until the bit-identity gates pass --
# and the gates run as four parallel jobs so the tail is max(board+anchors, slowest riven)
# instead of their sum:
#
#   build        ~2 min warm (cold: fetch + 2 cargo passes, cached by actions/cache)
#   gate-board   board-100 + wasm-anchors-105, sequentially on one runner (~63-135 s each)
#   gate-riven   one frozen riven each (matrix of 3, fail-fast off so all three report)
#
# Measuring the split in the wild: runs 38970844958 (256 s of gates) and 38973837158 (544 s).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"          # catch upstream moves even when nothing changed here
  push:
    paths:
      - "ci/patches/**"
      - "ci/core-host-template/**"
      - "ci/fetch_sources.py"
      - "ci/build_engine.py"
      - "ci/gate_engine.py"
      - "ci/tools/**"
      - ".github/workflows/build-engine.yml"

permissions:
  contents: read

concurrency:
  group: build-engine
  cancel-in-progress: false

# A Windows runner's stdout is cp1252, so any non-ASCII print (these tools are
# bilingual) raises UnicodeEncodeError and kills the step after the work is done
# -- measured on run 38968135623.  UTF-8 mode makes that impossible.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Repeat runs must not pay 6 minutes of downloads again.  The key carries
      # the run id on purpose (a cache entry is immutable, so a new key is how
      # you update it); restore-keys reuses whatever the previous run saved.
      - name: cache the upstream worktree + cargo registry
        uses: actions/cache@v6
        with:
          path: |
            engine-src/work
            ~/.cargo/registry
            ~/.cargo/git
          key: wfsim-ci-${{ hashFiles('ci/patches/**', 'ci/core-host-template/**') }}-${{ github.run_id }}
          restore-keys: |
            wfsim-ci-${{ hashFiles('ci/patches/**', 'ci/core-host-template/**') }}-

      # The compile cache itself: ~542 MB locally (409 MB of it `deps`).  A cold
      # run compiles the mimalloc C library, serde, the optimizer and webapi
      # crates twice -- the instrumented pass alone took 3m58s on the runner.
      - name: cache the msvc target dir
        uses: actions/cache@v6
        with:
          path: dist/target
          key: wfsim-target-${{ runner.os }}-${{ hashFiles('ci/patches/**', 'ci/core-host-template/**') }}-${{ github.run_id }}
          restore-keys: |
            wfsim-target-${{ runner.os }}-${{ hashFiles('ci/patches/**', 'ci/core-host-template/**') }}-
            wfsim-target-${{ runner.os }}-

      # The trained PGO profile (~3 MB) is the most valuable intermediate product
      # we have: reusing it skips the instrumented build *and* the training run.
      # rustc only warns when a profile's control flow moved, and the gates below
      # still verify every bit, so a near miss is free speed rather than risk.
      - name: cache the PGO profile
        uses: actions/cache@v6
        with:
          path: dist/pgo
          key: wfsim-pgo-${{ hashFiles('ci/patches/**', 'ci/tools/corpus.json', 'ci/tools/riven_corpus.json') }}-${{ github.run_id }}
          restore-keys: |
            wfsim-pgo-${{ hashFiles('ci/patches/**', 'ci/tools/corpus.json', 'ci/tools/riven_corpus.json') }}-
            wfsim-pgo-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: rust toolchain (matches the client's pinned 1.97.1)
        run: |
          rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal
          rustup component add llvm-tools-preview --toolchain 1.97.1-x86_64-pc-windows-msvc
          rustc --version

      - name: fetch upstream sources + apply our patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ci/fetch_sources.py

      - name: build MSVC + PGO engine
        run: python ci/build_engine.py --crt-static --target-cpu x86-64-v3 --gates none --reuse-profdata

      - name: upload engine + identity
        uses: actions/upload-artifact@v7
        with:
          name: wfsim-core-and-identity
          path: |
            dist/wfsim-core.exe
            dist/engine-identity.json
          retention-days: 30

  # Two slices on one runner: they share the exe download and a runner, and each is
  # only ~1-2 minutes.  Splitting them too would save another minute, not worth a job.
  gate-board:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: wfsim-core-and-identity
          path: dist
      - name: 100 frozen board rows + the 5 site-wasm anchors
        run: python ci/gate_engine.py --exe dist/wfsim-core.exe --gate board --port 9501
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-board-logs
          path: dist/gate-*.log
          retention-days: 14

  # One frozen riven per runner, all three at once.  fail-fast is off so a broken
  # riven does not hide whether the other two still match the site's wasm.
  gate-riven:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        riven:
          - riven-SR2N0246
          - riven-SR2N024X
          - riven-SR2N0270
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: wfsim-core-and-identity
          path: dist
      - name: ${{ matrix.riven }}
        run: >-
          python ci/gate_engine.py --exe dist/wfsim-core.exe --gate riven
          --riven-corpus ci/tools/riven3.json --riven-only ${{ matrix.riven }} --port 9503
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-log-${{ matrix.riven }}
          path: dist/gate-*.log
          retention-days: 14
