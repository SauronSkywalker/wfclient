name: build-engine

# Workflow 1/5 -- 产物线：把"上游当前 revision + 我们的补丁"编成交付引擎。
#
# 定稿链路（m06739）：build -> publish -> verify -> refresh，**全部在同一次 run 里**
# 按顺序跑完，谁也不等谁的"完成事件"：
#   current  build    编出 wfsim-core.exe + engine-identity.json
#   -> publish        四条块先发出去（engine-<id> / portable-<id> / deps-<id>）
#   -> verify         发布完成之后才跑四道逐位闸门（跑多久、红不红都挡不住发布）
#   -> refresh        闸门红了才用站点 wasm 把冻结基准表重算对齐
#
# 为什么必须是"同一次 run + 调用可复用工作流"，而不是"工作流完成事件"：
#   由 GITHUB_TOKEN 触发的事件不会再触发新工作流。实测：watch-engine 自动派发的
#   那次构建（run 39007927680 / commit 532a3cb2）编成功了，`release` 却一次都没跑，
#   用户端因此继续 404。调用可复用工作流是在同一次 run 内执行的，没有这个限制。
#
# 触发：
#   * watch-engine 每 5 分钟比对"服务器 engine id vs 本仓库 engine-<id> release"，
#     一旦发现没发布过就 dispatch 这里（上游是别人的仓库，拿不到 webhook）；
#   * ci/patches/** 或 ci/core-host-template/** 变更（只有这两类才真的会改变引擎）；
#   * 手动（可指定上游 ref）。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要编译的上游 commit/ref（留空＝服务器当前引擎所用的那个 commit）"
        required: false
        default: ""
  push:
    paths:
      - "ci/patches/**"
      - "ci/core-host-template/**"

# 被调用的三个工作流只能用调用者给的权限，所以这里必须是 write：
# release.yml 要建 release，gate-engine.yml 要下载产物，refresh-baseline.yml 还要提交回仓库。
permissions:
  contents: write
  actions: write

# 同一时间只跑一个引擎构建：并发构建只会互相抢缓存、白烧时间
concurrency:
  group: build-engine
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: cache the synced upstream tree + the cargo registry
        uses: actions/cache@v6
        with:
          path: |
            engine-src/work
            ~/.cargo/registry
            ~/.cargo/git
          key: wfsim-ci-${{ hashFiles('ci/patches/**', 'ci/core-host-template/**') }}-${{ github.run_id }}
          restore-keys: |
            wfsim-ci-${{ hashFiles('ci/patches/**', 'ci/core-host-template/**') }}-

      - name: cache the compiled dependencies (dist/target)
        uses: actions/cache@v6
        with:
          path: dist/target
          key: wfsim-target-${{ runner.os }}-${{ hashFiles('ci/patches/**') }}-${{ github.run_id }}
          restore-keys: |
            wfsim-target-${{ runner.os }}-${{ hashFiles('ci/patches/**') }}-

      - name: cache the PGO profile
        uses: actions/cache@v6
        with:
          path: dist/pgo
          key: wfsim-pgo-${{ hashFiles('ci/patches/**', 'ci/tools/corpus.json', 'ci/tools/riven_corpus.json') }}-${{ github.run_id }}
          restore-keys: |
            wfsim-pgo-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: resolve the upstream ref (the server's own commit when we can read it)
        id: ref
        shell: python
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          import json, os, urllib.request, pathlib

          ref = (os.environ.get("INPUT_REF") or "").strip()
          origin = "manual input"
          if not ref:
              try:
                  rel = json.loads(urllib.request.urlopen("https://wfsim.app/release.json", timeout=30).read())
                  ref = str(rel.get("commit") or "").rstrip("+")
                  origin = f"release.json (engine {rel.get('engine')}, release {rel.get('release')})"
              except Exception as e:
                  print(f"WARNING: cannot read release.json ({type(e).__name__}: {e}); falling back to main")
          ref = ref or "main"
          print(f"building upstream ref {ref}   [{origin}]")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
              f.write(f"ref={ref}\n")

      - name: rust toolchain - pinned, because the engine is built with 1.97.1
        run: |
          rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --component llvm-tools-preview
          rustup default 1.97.1-x86_64-pc-windows-msvc

      - name: fetch upstream sources + apply our patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ci/fetch_sources.py --ref "${{ steps.ref.outputs.ref }}"

      - name: build the MSVC + PGO engine (gates run later, after publishing)
        run: python ci/build_engine.py --crt-static --target-cpu x86-64-v3 --gates none --reuse-profdata

      - name: upload the engine + its identity
        uses: actions/upload-artifact@v7
        with:
          name: wfsim-core-and-identity
          path: |
            dist/wfsim-core.exe
            dist/engine-identity.json
          if-no-files-found: error
          retention-days: 30

      - name: upload the PGO profile (so a local native build can reuse it)
        uses: actions/upload-artifact@v7
        with:
          name: pgo-profile
          path: dist/pgo/default.profdata
          if-no-files-found: warn
          retention-days: 30

  # 一：编完立刻发布。不发出去，用户端的更新器就只能 404。
  publish:
    needs: build
    uses: ./.github/workflows/release.yml
    with:
      run_id: ${{ github.run_id }}

  # 二：发布完成之后才验算。闸门跑 5 分钟也好、红叉也好，用户已经能下到引擎了。
  verify:
    needs: publish
    uses: ./.github/workflows/gate-engine.yml
    with:
      run_id: ${{ github.run_id }}

  # 三：闸门红了＝冻结基准过期了，用站点 wasm 重算基准表（green 就什么都不做）。
  refresh:
    needs: verify
    # `always()` 不能省：不带状态函数的 if 会被 GitHub 隐含地和 success() 相与，
    # 于是 "needs.verify.result == 'failure'" 恒为假（旧写法就是这样，refresh 从没跑过）。
    if: ${{ always() && needs.verify.result == 'failure' }}
    uses: ./.github/workflows/refresh-baseline.yml
    with:
      run_id: ${{ github.run_id }}
