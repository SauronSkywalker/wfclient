name: build-engine

# Workflow 1/4 -- 产物线：把"上游当前 revision + 我们的补丁"编成交付引擎。
# 只负责构建与产物，不负责判定：四道逐位闸门搬到了 gate-engine.yml。
#   定稿规则：**构建成功就发布**；验算不一致只让 gate-engine 红叉（+失败邮件），不挡发布。
#   这样上游一改计算、服务器换 engine id 时，我们能第一时间把新引擎发出去，
#   而不是被"旧冻结基准对不上"卡死（用户端就会 404）。
# 触发：
#   * watch-engine 每隔 30 分钟比对"服务器 engine id vs 本仓库 engine-<id> release"，
#     一旦发现没发布过就 dispatch 这里（上游是别人的仓库，拿不到 webhook）；
#   * ci/patches/** 或 ci/core-host-template/** 变更（只有这两类才真的会改变引擎）；
#   * 手动（可指定上游 ref）。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要编译的上游 commit/ref（留空＝服务器当前引擎所用的那个 commit）"
        required: false
        default: ""
  push:
    paths:
      - "ci/patches/**"
      - "ci/core-host-template/**"

permissions:
  contents: read

# 同一时间只跑一个引擎构建：并发构建只会互相抢缓存、白烧时间
concurrency:
  group: build-engine
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: cache the synced upstream tree + the cargo registry
        uses: actions/cache@v6
        with:
          path: |
            engine-src/work
            ~/.cargo/registry
            ~/.cargo/git
          key: wfsim-ci-${{ hashFiles('ci/patches/**', 'ci/core-host-template/**') }}-${{ github.run_id }}
          restore-keys: |
            wfsim-ci-${{ hashFiles('ci/patches/**', 'ci/core-host-template/**') }}-

      - name: cache the compiled dependencies (dist/target)
        uses: actions/cache@v6
        with:
          path: dist/target
          key: wfsim-target-${{ runner.os }}-${{ hashFiles('ci/patches/**') }}-${{ github.run_id }}
          restore-keys: |
            wfsim-target-${{ runner.os }}-${{ hashFiles('ci/patches/**') }}-

      - name: cache the PGO profile
        uses: actions/cache@v6
        with:
          path: dist/pgo
          key: wfsim-pgo-${{ hashFiles('ci/patches/**', 'ci/tools/corpus.json', 'ci/tools/riven_corpus.json') }}-${{ github.run_id }}
          restore-keys: |
            wfsim-pgo-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: resolve the upstream ref (the server's own commit when we can read it)
        id: ref
        shell: python
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          import json, os, urllib.request, pathlib

          ref = (os.environ.get("INPUT_REF") or "").strip()
          origin = "manual input"
          if not ref:
              try:
                  rel = json.loads(urllib.request.urlopen("https://wfsim.app/release.json", timeout=30).read())
                  ref = str(rel.get("commit") or "").rstrip("+")
                  origin = f"release.json (engine {rel.get('engine')}, release {rel.get('release')})"
              except Exception as e:
                  print(f"WARNING: cannot read release.json ({type(e).__name__}: {e}); falling back to main")
          ref = ref or "main"
          print(f"building upstream ref {ref}   [{origin}]")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
              f.write(f"ref={ref}\n")

      - name: rust toolchain - pinned, because the engine is built with 1.97.1
        run: |
          rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --component llvm-tools-preview
          rustup default 1.97.1-x86_64-pc-windows-msvc

      - name: fetch upstream sources + apply our patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ci/fetch_sources.py --ref "${{ steps.ref.outputs.ref }}"

      - name: build the MSVC + PGO engine (gates live in gate-engine.yml)
        run: python ci/build_engine.py --crt-static --target-cpu x86-64-v3 --gates none --reuse-profdata

      - name: upload the engine + its identity
        uses: actions/upload-artifact@v7
        with:
          name: wfsim-core-and-identity
          path: |
            dist/wfsim-core.exe
            dist/engine-identity.json
          if-no-files-found: error
          retention-days: 30

      - name: upload the PGO profile (so a local native build can reuse it)
        uses: actions/upload-artifact@v7
        with:
          name: pgo-profile
          path: dist/pgo/default.profdata
          if-no-files-found: warn
          retention-days: 30
