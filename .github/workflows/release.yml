name: release

# Workflow 2/5 -- 发布线：编完先发出去（由 build-engine 在同一次 run 里调用，也可手动）。
# 三条独立的 release 线：
#
#   engine-<id>     只放引擎本体（wfsim-core.exe + engine-identity.json）
#                   给"只想换引擎"的人和客户端更新器用；标签就是 engine id，客户端
#                   拿到服务器下发的 engine id 后按 `releases/tags/engine-<id>` 直取。
#   portable-<id>   放带最新引擎的完整便携包 zip（客户端 src + 便携版 Python + 依赖
#                   + 说明 + 启动脚本），是给普通用户的下载入口，标为 latest。
#                   zip 只按 engine id 命名 + 同名覆盖 ⇒ 每个 id 永远只有 1 个包
#                   （早先用时间戳命名，一天就堆了 4 个 ~22 MB 的包）。
#   deps-<id>       放"自编译依赖包"：除 Visual Studio 以外全部自包含，解压进便携包
#                   就能在设置页点「编译本机最快引擎」（native + PGO，比通用版快
#                   10%~15%）。给想要最快本体、又不想装 rustup / 拉源码的用户。
#
# 三条线各自发布，互不覆盖：只想换引擎的人不必再下一整个包，反之亦然。
# 由 build-engine.yml 在**同一次 run** 里调用它 —— 这是唯一可靠的串法：
# 由 GITHUB_TOKEN 触发的事件不会再触发新工作流，watch-engine 自动派发的那次构建
# （run 39007927680）编成功了却没有发布，用户端就一直 404。
# 手动 dispatch 仍然保留，用于重发最近一次成功产物。
on:
  workflow_call:
    inputs:
      run_id:
        description: "产物所在的那次 build-engine run id（调用方传自己的 run id）"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      run_id:
        description: "build-engine 的 run id（留空则用本工作流自己的 id，通常用于手动重发最近一次成功产物时填）"
        required: false

permissions:
  contents: write          # create the releases
  actions: read            # download the artifact built by workflow 1

concurrency:
  group: release
  cancel-in-progress: false

# cp1252 stdout on a Windows runner + a Chinese print = a killed step; UTF-8 mode
# makes that impossible (same fix as build-engine.yml).
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  engine:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: download the engine built by build-engine
        uses: actions/download-artifact@v8
        with:
          name: wfsim-core-and-identity
          path: dist
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: read the engine identity
        id: ident
        shell: python
        run: |
          import json, os, pathlib
          d = json.loads(pathlib.Path("dist/engine-identity.json").read_text(encoding="utf-8"))
          eng = d.get("engine_online") or d.get("engine") or "unknown"
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
              f.write(f"engine={eng}\n")
              f.write(f"sha={d.get('sha256','')}\n")
              f.write(f"size={d.get('size',0)}\n")
              f.write(f"cpu={d.get('target_cpu','')}\n")
              f.write(f"crt={'static' if d.get('crt_static') else 'dynamic'}\n")
          print(eng, d.get("sha256"))

      - name: publish the engine release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: engine-${{ steps.ident.outputs.engine }}
          name: "wfclient engine ${{ steps.ident.outputs.engine }}"
          make_latest: "false"
          body: |
            只含引擎本体，供已有便携包的用户替换 `engine/wfsim-core.exe`（标签即 engine id，可幂等重发）。

            | 字段 | 值 |
            |---|---|
            | engine id | `${{ steps.ident.outputs.engine }}` |
            | sha256 | `${{ steps.ident.outputs.sha }}` |
            | size | ${{ steps.ident.outputs.size }} bytes |
            | target-cpu | `${{ steps.ident.outputs.cpu }}`（AVX2 通用版） |
            | CRT | ${{ steps.ident.outputs.crt }} |
            | 构建 | MSVC + PGO + mimalloc，三道逐位闸门全过才发布 |

            用法：解压覆盖到便携包 `engine/`（先把旧文件另存为 `wfsim-core.prev.exe`）。完整包见
            `portable-${{ steps.ident.outputs.engine }}`。
          files: |
            dist/wfsim-core.exe
            dist/engine-identity.json
          overwrite_files: true      # re-publishing the same engine id replaces, never accumulates
          fail_on_unmatched_files: true

  portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: download the engine built by build-engine
        uses: actions/download-artifact@v8
        with:
          name: wfsim-core-and-identity
          path: dist
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: read the engine identity
        id: ident
        shell: python
        run: |
          import json, os, pathlib
          d = json.loads(pathlib.Path("dist/engine-identity.json").read_text(encoding="utf-8"))
          eng = d.get("engine_online") or d.get("engine") or "unknown"
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
              f.write(f"engine={eng}\n")
              f.write(f"sha={d.get('sha256','')}\n")
          print(eng, d.get("sha256"))

      - name: pack the portable zip
        run: python ci/pack_portable.py --build-dir dist/staging --keep-build

      - name: publish the portable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: portable-${{ steps.ident.outputs.engine }}
          name: "wfclient portable ${{ steps.ident.outputs.engine }}"
          make_latest: "true"
          body: |
            完整便携包：内置打好补丁的引擎（MSVC + PGO + mimalloc，随包预编译）、客户端 src、
            便携版 Python 与依赖、使用说明与启动脚本。解压后双击 `run-portable.bat` 即可运行。

            | 字段 | 值 |
            |---|---|
            | engine id | `${{ steps.ident.outputs.engine }}` |
            | 引擎 sha256 | `${{ steps.ident.outputs.sha }}` |

            只想替换引擎、不想重下整包的话，见 `engine-${{ steps.ident.outputs.engine }}`。
            详细说明见包内 `README-便携包.md`，引擎身份见 `engine/engine-identity.json`。
          files: dist/wfsim-portable-*.zip
          overwrite_files: true      # the zip is named by engine id only, so each id keeps exactly one
          fail_on_unmatched_files: true

  # Workflow 2 of 2, third product -- 想让本机跑 native 引擎、又不想装 rustup / 自己拉源码的人，
  # 只要把这条 zip 解压进 portable 包，再装一个 Visual Studio，就能在设置页点「编译本机最快引擎」。
  # 这里不编译引擎（编译已经在 build-engine 里做过并过了闸门），只把"编译引擎需要的东西"打包：
  # 裁剪过的 rust msvc 工具链（346 MB）、离线 crate 缓存、本次 revision 的 PGO 剖面、补丁与
  # 已打补丁的上游源码。除 Visual Studio 以外全部自包含（.lib 不允许再分发，见 自构建说明.md §3.1）。
  deps:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: download the engine identity built by build-engine
        uses: actions/download-artifact@v8
        with:
          name: wfsim-core-and-identity
          path: dist
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The profile is optional by design (the client trains one locally when it is
      # missing, ~4.5 minutes slower); `if-no-files-found: warn` on the producer side
      # makes that a warning rather than a failed delivery.
      - name: download the trained PGO profile
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pgo-profile
          path: dist/pgo
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: rust toolchain (the same pinned 1.97.1 the engine is built with)
        run: |
          rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal
          rustup component add llvm-tools-preview --toolchain 1.97.1-x86_64-pc-windows-msvc

      - name: fetch upstream sources + apply our patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ci/fetch_sources.py

      # Vendored crates: the user's machine compiles with CARGO_NET_OFFLINE=true, so the
      # registry has to be inside the zip.  `cargo fetch` fills cache/ + src/ + index/.
      - name: vendor the crate registry
        env:
          CARGO_HOME: ${{ github.workspace }}\dist\cargo-home
        run: cargo fetch
        working-directory: engine-src/work

      - name: trim the toolchain (1.1 GB -> ~350 MB)
        shell: pwsh
        run: |
          python ci/trim_toolchain.py `
            --toolchain "$env:USERPROFILE\.rustup\toolchains\1.97.1-x86_64-pc-windows-msvc" `
            --out dist/toolchain-msvc

      - name: read the engine identity
        id: ident
        shell: python
        run: |
          import json, os, pathlib
          d = json.loads(pathlib.Path("dist/engine-identity.json").read_text(encoding="utf-8"))
          eng = d.get("engine_online") or d.get("engine") or "unknown"
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
              f.write(f"engine={eng}\n")
          print(eng)

      - name: pack the offline self-build dependencies
        run: >-
          python ci/make_deps.py --root . --toolchain dist/toolchain-msvc
          --registry dist/cargo-home/registry --work engine-src/work --ci ci
          --engine ${{ steps.ident.outputs.engine }} --out dist/wfclient-deps-${{ steps.ident.outputs.engine }}.zip

      - name: publish the deps release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: deps-${{ steps.ident.outputs.engine }}
          name: "wfclient self-build deps ${{ steps.ident.outputs.engine }}"
          make_latest: "false"
          body: |
            自编译依赖包（**除 Visual Studio 以外全部自包含**），配合 `portable-${{ steps.ident.outputs.engine }}` 使用。

            1. 解压便携包，双击 `run-portable.bat` 确认能跑；
            2. 把本包解压到便携包目录（与 `run-portable.bat` 同层，覆盖合并）；
            3. 双击 `build-engine.bat`，或在 TUI 设置页点 **编译本机最快引擎**。

            包含：裁剪过的 rust `1.97.1-x86_64-pc-windows-msvc`（约 346 MB，含 `llvm-profdata`）、
            离线 crate 缓存、本次 revision 的 PGO 剖面、四个源码补丁、已打补丁的上游源码。
            编译**离线**完成，产物是 `engine/wfsim-core.native.exe`，**不覆盖**通用引擎；
            两者 revision 一致时优先跑 native，对不上自动回落。

            唯一要你自己装的是 **Visual Studio**（`cl.exe`/`link.exe` 与 SDK 导入库不允许再分发）：
            装最新的 **VS 2026** 即可，2022 起都行，`winget install --id Microsoft.VisualStudio.BuildTools -e`
            或 <https://visualstudio.microsoft.com/visual-cpp-build-tools/>，装完不用配环境变量。
            详见包内 `build-deps/README-自编译依赖.md`。
          files: dist/wfclient-deps-*.zip
          overwrite_files: true
          fail_on_unmatched_files: true

  # 发布到这一步就结束。验算**不由这里派发**：build-engine 在发布完成后直接调用
  # gate-engine.yml（同一次 run），因为 GITHUB_TOKEN 派发的事件唤不醒下游 workflow_run。
