name: release-portable

# Workflow 2 of 2 -- "把引擎 + src + 便携版 Python + 依赖 + 说明 + 启动脚本打成 zip"
# Triggered when build-engine succeeds, or by hand (workflow_dispatch) to repackage the
# current engine artifact.
on:
  workflow_run:
    workflows: ["build-engine"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write          # create the release
  actions: read            # download the artifact built by workflow 1

concurrency:
  group: release-portable
  cancel-in-progress: false

jobs:
  portable:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: download the engine built by build-engine
        uses: actions/download-artifact@v4
        with:
          name: wfsim-core-and-identity
          path: dist
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: pack the portable zip
        run: python ci/pack_portable.py --build-dir dist/staging --keep-build

      - name: smoke test the packed engine (5 WASM anchors)
        run: python ci/tools/run_corpus.py dist/staging/engine/wfsim-core.exe --anchors --port 9510

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-${{ github.run_number }}
          name: "wfclient portable ${{ github.run_number }}"
          body: |
            便携包：内置打好补丁的引擎（MSVC + PGO + mimalloc）、客户端 src、便携版 Python 与依赖、使用说明与启动脚本。

            解压后双击 `run-portable.bat` 即可运行；详细说明见包内 `README-便携包.md`。

            引擎身份与逐位闸门结果见 `engine/engine-identity.json` 与本次 Actions 日志。
          files: dist/wfsim-portable-*.zip
          fail_on_unmatched_files: true
